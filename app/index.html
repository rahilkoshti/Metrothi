              "text": "Metrothi is a free, offline-capable journey planner for the Ahmedabad and Gandhinagar Metro. It shows the fastest route between any two stations, live train timings, interchange waits, and the exact fare for your trip."

            "@type": "Question",
            "name": "Which is the interchange station on the Ahmedabad Metro?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Old High Court is the main interchange, where the Blue Line and Red Line connect. Metrothi automatically routes you through interchanges and adds the transfer wait to your total journey time."
            }
          },
          {
            "@type": "Question",
            "name": "How is the Ahmedabad Metro fare calculated?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Fares are distance-based, using GMRC's official distance slabs. Metrothi computes the fare from the actual track distance of your route rather than a flat per-trip charge."
            }
          },
          {
            "@type": "Question",
            "name": "Is there a discount on Ahmedabad Metro fares?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "GMRC offers a 10% discount on completion of a journey when you pay with a smart card (CSC) or a National Common Mobility Card (NCMC). Metrothi shows token fares by default and notes where the discount applies."
            }
          },
          {
            "@type": "Question",
            "name": "Does Metrothi work offline?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Metrothi is an installable Progressive Web App. Once loaded, you can plan journeys, view timings, and check fares even in airplane mode, without any network connection."
            }
          }
        ]
      }

    <script>
      // Set data-theme and the background before first paint, from the same
      // localStorage key ThemeContext reads - otherwise a rider sees a frame
      // of the wrong theme on every cold start.
      //
      // The key holds the *preference*, which may be 'system'. Anything that
      // isn't an explicit 'dark' or 'light' - including a first-ever run, where
      // the key is absent - defers to the OS. The app used to default to light
      // here and never consult prefers-color-scheme at all, so a phone in dark
      // mode got the app's least-tested surface on first paint.
      (function () {
        var theme;
        var pref = null;
        try {
          pref = localStorage.getItem('metrothi-theme');
        } catch (e) {}
        if (pref === 'dark' || pref === 'light') {
          theme = pref;
        } else {
          try {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } catch (e) {
            theme = 'light';
          }
        }
        var bg = theme === 'dark' ? '#0f0f0f' : '#f4f4f5';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.background = bg;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', bg);
      })();
    </script>
