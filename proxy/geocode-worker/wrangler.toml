name = "metrothi-geocode"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Secrets (never commit these — set them with wrangler):
#   wrangler secret put MAPPLS_CLIENT_ID
#   wrangler secret put MAPPLS_CLIENT_SECRET

[vars]
# Tighten this to the deployed app origin once it has one, e.g.
# ALLOWED_ORIGIN = "https://metrothi.example.com"
# During local dev (vite on localhost:5173), CORS doesn't matter for curl/
# server-to-server testing, but the browser app itself needs its real
# origin listed here once this is no longer "*".
ALLOWED_ORIGIN = "*"
